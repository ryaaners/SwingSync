[project]
name = "swingsync-pose-runtime"
version = "0.1.0"
description = "Isolated CPU pose extraction environment; not part of the root ML experiment runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mediapipe==1.2.2",
  "numpy==2.2.5",
  "opencv-contrib-python==4.12.0.88",
  "av==16.0.1",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

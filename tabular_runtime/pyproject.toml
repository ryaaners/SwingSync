[project]
name = "swingsync-tabular-runtime"
version = "0.1.0"
description = "Isolated CaddieSet grouped research; no uploaded-video inference"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.5",
  "scipy==1.15.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest==8.3.5"]
